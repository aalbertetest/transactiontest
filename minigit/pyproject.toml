[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minigit"
version = "0.1.0"
description = "A minimal Git-like version-control system written in Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "minigit contributors" }]

[project.scripts]
minigit = "minigit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["minigit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
