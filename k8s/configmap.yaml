apiVersion: v1
kind: ConfigMap
metadata:
  name: chat-config
data:
  JWT_ALGORITHM: HS256
  ACCESS_TOKEN_TTL: "3600"
  ENABLE_BACKGROUND_WORKERS: "true"
  ENABLE_PRESENCE_BROADCAST: "true"
  DELIVERY_POLL_INTERVAL: "0.2"
  PRESENCE_BROADCAST_INTERVAL: "1.0"
  DELIVERY_BATCH_SIZE: "25"
  MAX_RETRIES: "5"
  BASE_RETRY_SECONDS: "0.5"
  MAX_RETRY_SECONDS: "10"
  OFFLINE_RETRY_SECONDS: "5"
  LEASE_SECONDS: "15"
