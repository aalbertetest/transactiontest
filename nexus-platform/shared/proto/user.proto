// =============================================================================
// ORGANIZATION REQUEST/RESPONSE
// =============================================================================

// CreateOrganizationRequest
message CreateOrganizationRequest {
  nexus.common.RequestMetadata metadata = 1;
  string name = 2;
  string slug = 3;
  string description = 4;
  OrganizationType type = 5;
  string billing_email = 6;
  nexus.common.Address address = 7;
}

// CreateOrganizationResponse
message CreateOrganizationResponse {
  nexus.common.ResponseMetadata metadata = 1;
  bool success = 2;
  Organization organization = 3;
  nexus.common.Error error = 4;
}

// GetOrganizationRequest
message GetOrganizationRequest {
