syntax = "proto3";

package platform.v1;

message Empty {}

message Status {
  string code = 1;
  string message = 2;
}

message User {
  string id = 1;
  string email = 2;
  string display_name = 3;
  string status = 4;
}

message PaymentIntent {
  string id = 1;
  string user_id = 2;
  int64 amount = 3;
  string currency = 4;
  string status = 5;
  string idempotency_key = 6;
}

message WorkflowRun {
  string id = 1;
  string workflow_id = 2;
  string status = 3;
  string current_step = 4;
}

message QueueMessage {
  string id = 1;
  string queue = 2;
  string payload_json = 3;
  int32 attempt = 4;
}

message StreamRecord {
  string topic = 1;
  int32 partition = 2;
  int64 offset = 3;
  string key = 4;
  string value = 5;
}

message CacheEntry {
  string key = 1;
  string value = 2;
  int64 ttl_seconds = 3;
}

service AuthService {
  rpc Authorize (AuthorizeRequest) returns (AuthorizeResponse);
  rpc Token (TokenRequest) returns (TokenResponse);
  rpc Refresh (RefreshRequest) returns (TokenResponse);
  rpc EnrollMfa (EnrollMfaRequest) returns (EnrollMfaResponse);
  rpc VerifyMfa (VerifyMfaRequest) returns (VerifyMfaResponse);
}

message AuthorizeRequest {
  string client_id = 1;
  string redirect_uri = 2;
  string scope = 3;
  string state = 4;
  string user_id = 5;
}

message AuthorizeResponse {
  string code = 1;
  string state = 2;
}

message TokenRequest {
  string grant_type = 1;
  string code = 2;
  string client_id = 3;
  string client_secret = 4;
}

message TokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
}

message RefreshRequest {
  string refresh_token = 1;
}

message EnrollMfaRequest {
  string user_id = 1;
}

message EnrollMfaResponse {
  string secret = 1;
  string uri = 2;
}

message VerifyMfaRequest {
  string user_id = 1;
  string code = 2;
}

message VerifyMfaResponse {
  bool verified = 1;
}

service UserService {
  rpc RegisterUser (RegisterUserRequest) returns (RegisterUserResponse);
  rpc GetUser (GetUserRequest) returns (GetUserResponse);
  rpc UpdateUser (UpdateUserRequest) returns (UpdateUserResponse);
}

message RegisterUserRequest {
  string email = 1;
  string display_name = 2;
}

message RegisterUserResponse {
  User user = 1;
}

message GetUserRequest {
  string id = 1;
}

message GetUserResponse {
  User user = 1;
}

message UpdateUserRequest {
  string id = 1;
  string display_name = 2;
  string status = 3;
}

message UpdateUserResponse {
  User user = 1;
}

service PaymentService {
  rpc CreateIntent (CreateIntentRequest) returns (CreateIntentResponse);
  rpc GetIntent (GetIntentRequest) returns (GetIntentResponse);
  rpc CaptureIntent (CaptureIntentRequest) returns (CaptureIntentResponse);
  rpc RefundIntent (RefundIntentRequest) returns (RefundIntentResponse);
}

message CreateIntentRequest {
  string user_id = 1;
  int64 amount = 2;
  string currency = 3;
  string idempotency_key = 4;
}

message CreateIntentResponse {
  PaymentIntent intent = 1;
}

message GetIntentRequest {
  string id = 1;
}

message GetIntentResponse {
  PaymentIntent intent = 1;
}

message CaptureIntentRequest {
  string id = 1;
}

message CaptureIntentResponse {
  PaymentIntent intent = 1;
}

message RefundIntentRequest {
  string id = 1;
  int64 amount = 2;
}

message RefundIntentResponse {
  PaymentIntent intent = 1;
}

service WorkflowService {
  rpc RegisterWorkflow (RegisterWorkflowRequest) returns (RegisterWorkflowResponse);
  rpc StartWorkflow (StartWorkflowRequest) returns (StartWorkflowResponse);
  rpc GetWorkflowRun (GetWorkflowRunRequest) returns (GetWorkflowRunResponse);
}

message RegisterWorkflowRequest {
  string name = 1;
  string definition_json = 2;
}

message RegisterWorkflowResponse {
  string workflow_id = 1;
}

message StartWorkflowRequest {
  string workflow_id = 1;
  string input_json = 2;
}

message StartWorkflowResponse {
  WorkflowRun run = 1;
}

message GetWorkflowRunRequest {
  string run_id = 1;
}

message GetWorkflowRunResponse {
  WorkflowRun run = 1;
}

service QueueService {
  rpc Enqueue (EnqueueRequest) returns (EnqueueResponse);
  rpc Dequeue (DequeueRequest) returns (DequeueResponse);
  rpc Ack (AckRequest) returns (AckResponse);
}

message EnqueueRequest {
  string queue = 1;
  string payload_json = 2;
}

message EnqueueResponse {
  QueueMessage message = 1;
}

message DequeueRequest {
  string queue = 1;
  int32 max_messages = 2;
}

message DequeueResponse {
  repeated QueueMessage messages = 1;
}

message AckRequest {
  string queue = 1;
  string message_id = 2;
  bool success = 3;
}

message AckResponse {
  Status status = 1;
}

service StreamService {
  rpc Publish (PublishRequest) returns (PublishResponse);
  rpc Consume (ConsumeRequest) returns (ConsumeResponse);
  rpc Commit (CommitRequest) returns (CommitResponse);
}

message PublishRequest {
  string topic = 1;
  string key = 2;
  string value = 3;
}

message PublishResponse {
  StreamRecord record = 1;
}

message ConsumeRequest {
  string topic = 1;
  string group = 2;
  int32 max_records = 3;
}

message ConsumeResponse {
  repeated StreamRecord records = 1;
}

message CommitRequest {
  string topic = 1;
  string group = 2;
  int32 partition = 3;
  int64 offset = 4;
}

message CommitResponse {
  Status status = 1;
}

service CacheService {
  rpc Get (CacheGetRequest) returns (CacheGetResponse);
  rpc Put (CachePutRequest) returns (CachePutResponse);
  rpc Delete (CacheDeleteRequest) returns (CacheDeleteResponse);
}

message CacheGetRequest {
  string key = 1;
}

message CacheGetResponse {
  CacheEntry entry = 1;
}

message CachePutRequest {
  string key = 1;
  string value = 2;
  int64 ttl_seconds = 3;
}

message CachePutResponse {
  Status status = 1;
}

message CacheDeleteRequest {
  string key = 1;
}

message CacheDeleteResponse {
  Status status = 1;
}

service DatabaseService {
  rpc Query (QueryRequest) returns (QueryResponse);
  rpc Execute (ExecuteRequest) returns (ExecuteResponse);
  rpc DocumentGet (DocumentGetRequest) returns (DocumentGetResponse);
  rpc DocumentPut (DocumentPutRequest) returns (DocumentPutResponse);
}

message QueryRequest {
  string sql = 1;
  string params_json = 2;
}

message QueryResponse {
  string rows_json = 1;
}

message ExecuteRequest {
  string sql = 1;
  string params_json = 2;
}

message ExecuteResponse {
  Status status = 1;
}

message DocumentGetRequest {
  string collection = 1;
  string key = 2;
}

message DocumentGetResponse {
  string document_json = 1;
}

message DocumentPutRequest {
  string collection = 1;
  string key = 2;
  string document_json = 3;
}

message DocumentPutResponse {
  Status status = 1;
}

service RealtimeService {
  rpc Publish (RealtimePublishRequest) returns (RealtimePublishResponse);
}

message RealtimePublishRequest {
  string channel = 1;
  string payload_json = 2;
}

message RealtimePublishResponse {
  Status status = 1;
}

service SchedulerService {
  rpc CreateSchedule (CreateScheduleRequest) returns (CreateScheduleResponse);
  rpc EnableSchedule (EnableScheduleRequest) returns (EnableScheduleResponse);
  rpc DisableSchedule (DisableScheduleRequest) returns (DisableScheduleResponse);
}

message CreateScheduleRequest {
  string cron = 1;
  string payload_json = 2;
}

message CreateScheduleResponse {
  string schedule_id = 1;
}

message EnableScheduleRequest {
  string schedule_id = 1;
}

message EnableScheduleResponse {
  Status status = 1;
}

message DisableScheduleRequest {
  string schedule_id = 1;
}

message DisableScheduleResponse {
  Status status = 1;
}

service WorkerService {
  rpc RegisterWorker (RegisterWorkerRequest) returns (RegisterWorkerResponse);
  rpc Heartbeat (HeartbeatRequest) returns (HeartbeatResponse);
  rpc TaskResult (TaskResultRequest) returns (TaskResultResponse);
}

message RegisterWorkerRequest {
  string worker_id = 1;
  string capabilities_json = 2;
}

message RegisterWorkerResponse {
  Status status = 1;
}

message HeartbeatRequest {
  string worker_id = 1;
}

message HeartbeatResponse {
  Status status = 1;
}

message TaskResultRequest {
  string task_id = 1;
  string status = 2;
  string output_json = 3;
}

message TaskResultResponse {
  Status status = 1;
}
