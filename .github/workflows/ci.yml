name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - cursor/**

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate -w @saas/backend

      - name: Run CI script
        run: npm run ci
