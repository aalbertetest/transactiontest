name: CD

on:
  push:
    branches:
      - main

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate -w @saas/backend

      - name: Build all workspaces
        run: npm run build

      - name: Archive backend artifact
        run: |
          tar -czf backend-dist.tgz apps/backend/dist apps/backend/prisma

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend-dist.tgz

      - name: Mock deploy
        run: echo "Deploy step placeholder - wire to your cloud provider"
