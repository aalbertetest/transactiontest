apiVersion: apps/v1
kind: Deployment
metadata:
  name: dwe-api
  namespace: workflow-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dwe-api
  template:
    metadata:
      labels:
        app: dwe-api
    spec:
      serviceAccountName: dwe-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: dwe-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: dwe-config
            - secretRef:
                name: dwe-secrets
          env:
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: dwe-api
  namespace: workflow-engine
spec:
  selector:
    app: dwe-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
