apiVersion: apps/v1
kind: Deployment
metadata:
  name: dwe-api
spec:
  replicas: {{ .Values.replicas.api }}
  selector:
    matchLabels:
      app: dwe-api
  template:
    metadata:
      labels:
        app: dwe-api
    spec:
      containers:
        - name: api
          image: {{ .Values.image.api }}
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: dwe-config
            - secretRef:
                name: dwe-secrets
          env:
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: dwe-api
spec:
  selector:
    app: dwe-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
