global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "workflow-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["dwe-api.workflow-engine.svc.cluster.local:80"]
  - job_name: "workflow-scheduler"
    metrics_path: /metrics
    static_configs:
      - targets: ["dwe-scheduler.workflow-engine.svc.cluster.local:9091"]
  - job_name: "workflow-executor"
    metrics_path: /metrics
    static_configs:
      - targets: ["dwe-executor.workflow-engine.svc.cluster.local:8001"]
